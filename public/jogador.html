<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050607" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Uma Noite no Inferno — Sobrevivente Lite</title>
  <link rel="stylesheet" href="/style.css?v=62" />
</head>
<body class="player-page lite-page">
  <main id="sheet-root" class="sheet-root"></main>

  <div id="portrait-modal" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal-card portrait-modal-card">
      <header class="modal-header">
        <div>
          <p class="eyebrow">RETRATOS</p>
          <h2>IMAGENS POR ESTADO</h2>
        </div>
        <button id="portrait-close" class="icon-button" type="button">×</button>
      </header>
      <div id="portrait-upload-grid" class="portrait-upload-grid"></div>
    </section>
  </div>


  <div id="style-modal" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal-card advantage-modal-card">
      <header class="modal-header">
        <div>
          <p class="eyebrow">ESTILOS DA ONE-SHOT</p>
          <h2>ESCOLHER PAPEL NO ELENCO</h2>
        </div>
        <button id="style-close" class="icon-button" type="button">×</button>
      </header>
      <p class="modal-copy">Use estes 6 estilos para 3 jogadores e 3 NPCs jogáveis. Cada estilo só pode pertencer a um sobrevivente.</p>
      <div id="style-list" class="advantage-picker-list"></div>
    </section>
  </div>

  <div id="item-modal" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal-card advantage-modal-card">
      <header class="modal-header">
        <div>
          <p class="eyebrow">ITENS DA CABANA</p>
          <h2>ESCOLHER ITEM</h2>
        </div>
        <button id="item-close" class="icon-button" type="button">×</button>
      </header>
      <div class="advantage-search-wrap">
        <input id="item-search" class="dark-input" placeholder="Pesquisar item..." />
      </div>
      <div id="item-list" class="advantage-picker-list"></div>
    </section>
  </div>

  <div id="advantage-modal" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal-card advantage-modal-card">
      <header class="modal-header">
        <div>
          <p class="eyebrow">VANTAGENS</p>
          <h2>ESCOLHER DIFERENCIAL</h2>
        </div>
        <button id="advantage-close" class="icon-button" type="button">×</button>
      </header>
      <div class="advantage-search-wrap">
        <input id="advantage-search" class="dark-input" placeholder="Pesquisar vantagem..." />
      </div>
      <div id="advantage-list" class="advantage-picker-list"></div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/player-catalog.js?v=62"></script>
  <script src="/advantages.js?v=62"></script>
  <script src="/common.js?v=62"></script>
  <script src="/audio.js?v=62"></script>
  <script src="/jogador.js?v=62"></script>
</body>
</html>
